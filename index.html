<!DOCTYPE html>
<html>

<head>
    <title>JSON in JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            padding: 25px;
            max-width: 450px;
            margin: auto;
            border-radius: 12px;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            background-color: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Student Details Using JSON</h2>

        <button onclick="showStudent()">Show Student</button>

        <p id="result">Click the button to see the details.</p>
    </div>

    <script>
        function showStudent() {

            // JSON string
            let jsonData = `{
                "name": "Ravi",
                "age": 15,
                "course": "JavaScript"
            }`;

            // Convert JSON string into JavaScript object
            let student = JSON.parse(jsonData);

            // Display student details
            document.getElementById("result").textContent =
                "Name: " + student.name +
                "\nAge: " + student.age +
                "\nCourse: " + student.course;
        }
    </script>

</body>

</html>
